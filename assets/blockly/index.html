<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블록 코딩</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
  #ws { position: absolute; inset: 0; }
  .blocklyTreeLabel, .blocklyText, .blocklyFlyoutLabelText { font-family: "Malgun Gothic", "Segoe UI", sans-serif !important; }
  .blocklyTreeRow { height: 34px; line-height: 34px; border-radius: 0 8px 8px 0; margin-bottom: 2px; }
</style>
<script src="blockly_compressed.js"></script>
<script src="blocks_compressed.js"></script>
<script src="python_compressed.js"></script>
<script src="msg/ko.js"></script>
</head>
<body>
<div id="ws"></div>
<script>
const G = python.pythonGenerator, O = python.Order;
G.INDENT = "    ";
G.INFINITE_LOOP_TRAP = "_tick()\n";
const DARK = new URLSearchParams(location.search).get("dark") === "1";

// ------------------------------------------------------------------ widgets from the GUI designer
let WIDGETS = [];  // [{name, type, label}]
const WTYPES = {
  text: ["label", "button", "input", "textbox", "checkbox", "radio", "combo", "list"],
  value: ["slider", "progress", "spin", "checkbox", "radio", "combo", "list", "input"],
  check: ["checkbox", "radio"],
  change: ["input", "textbox", "slider", "spin", "checkbox", "radio", "combo", "list"],
  list: ["combo", "list"],
};
function widgetMenu(kind) {
  return function () {
    const types = kind ? WTYPES[kind] : null;
    const opts = WIDGETS.filter((w) => !types || types.includes(w.type)).map((w) => [w.label, w.name]);
    const cur = this && this.getValue ? this.getValue() : null;
    if (cur && cur !== "__none__" && !opts.some((o) => o[1] === cur)) opts.push([cur + " (없음)", cur]);
    return opts.length ? opts : [["(GUI 디자이너에서 먼저 만드세요)", "__none__"]];
  };
}
function setWidgets(list) {
  WIDGETS = list;
  for (const b of ws.getAllBlocks(false)) {
    const f = b.getField("W");
    if (f) f.generatedOptions = null;
  }
}
function renameWidget(oldName, newName) {
  for (const b of ws.getAllBlocks(false)) {
    const f = b.getField("W");
    if (f && f.getValue() === oldName) {
      f.generatedOptions = null;  // dropdown caches its menu; force it to see the new name
      f.setValue(newName);
    }
  }
}
const wfield = (kind) => ({ type: "field_dropdown", name: "W", options: widgetMenu(kind) });

// ------------------------------------------------------------------ helpers placed into generated code
const DEFS = {
  import_winsound: "import winsound",
  import_web: "import webbrowser",
  import_datetime: "import datetime",
  import_pyautogui: "import pyautogui",
  type_helper: "def _type(text):\n    text = str(text)\n    if text.isascii():\n        pyautogui.write(text, interval=0.02)\n    else:\n        _clip(text)\n        time.sleep(0.05)\n        pyautogui.hotkey('ctrl', 'v')\n",
};
function need(...keys) {
  for (const k of keys) {
    if (k === "type_helper") need("import_pyautogui");
    G.definitions_[k] = DEFS[k];
  }
}
const val = (b, name, def) => G.valueToCode(b, name, O.NONE) || def;
const body = (b, name) => G.statementToCode(b, name) || G.INDENT + "pass\n";
const q = (s) => JSON.stringify(String(s));
G.addReservedWords("_answer,_t,_T,_ui,_tick,_wait,_on,_fire,_broadcast,_alert,_big,_confirm,_ask_text,_ask_number,_clip,_type,_color,_w,_set_text,_get_text,_set_value,_get_value,_set_visible,_set_color,_move,_list_add,_list_clear,_set_title,_key_down,_exit,_num,pyautogui,winsound,webbrowser,datetime,time,math,random,os,sys,threading,MainWindow");

// ------------------------------------------------------------------ block definitions
const COLORS = [["🔴 빨강", "red"], ["🟠 주황", "orange"], ["🟡 노랑", "gold"], ["🟢 초록", "green"],
  ["🔵 파랑", "blue"], ["🟣 보라", "purple"], ["🩷 분홍", "hotpink"], ["⚫ 검정", "black"], ["⚪ 흰색", "white"],
  ["🩶 회색", "gray"], ["🌈 랜덤", "random"]];
const KEY_EVENTS = [["스페이스", "space"], ["Enter", "enter"], ["↑ 위쪽 화살표", "up"], ["↓ 아래쪽 화살표", "down"],
  ["← 왼쪽 화살표", "left"], ["→ 오른쪽 화살표", "right"], ["Esc", "esc"], ["Tab", "tab"], ["Backspace", "backspace"],
  ["Shift", "shift"], ["Ctrl", "ctrl"]]
  .concat("abcdefghijklmnopqrstuvwxyz".split("").map((c) => [c.toUpperCase(), c]))
  .concat("0123456789".split("").map((c) => [c, c]))
  .concat([...Array(12).keys()].map((i) => ["F" + (i + 1), "f" + (i + 1)]));
const PRESS_KEYS = [["Enter", "enter"], ["스페이스", "space"], ["Tab", "tab"], ["Esc", "esc"], ["Backspace", "backspace"],
  ["Delete", "delete"], ["↑", "up"], ["↓", "down"], ["←", "left"], ["→", "right"], ["Home", "home"], ["End", "end"],
  ["F5", "f5"], ["윈도우 키", "win"]];

const C_EV = 35, C_UI = 200, C_W = 330, C_TIME = 45, C_SYS = 15, C_AUTO = 290, C_TURTLE = 160, C_LOOP = 120;
const stmt = (o) => Object.assign({ previousStatement: null, nextStatement: null, inputsInline: true }, o);
const hatDef = (o) => Object.assign({ nextStatement: null, inputsInline: true, colour: C_EV }, o);
const num = (name) => ({ type: "input_value", name, check: "Number" });
const any = (name) => ({ type: "input_value", name });
const dd = (name, options) => ({ type: "field_dropdown", name, options });

Blockly.common.defineBlocksWithJsonArray([
  // 시작 · 이벤트 (hats)
  hatDef({ type: "ev_start", message0: "🚩 프로그램이 시작되면", tooltip: "프로그램을 실행하면 아래 블록들이 실행돼요" }),
  hatDef({ type: "ev_key", message0: "⌨ %1 키를 눌렀을 때", args0: [dd("KEY", [["아무", "any"]].concat(KEY_EVENTS))] }),
  hatDef({ type: "ev_click", message0: "🖱 %1 을(를) 클릭했을 때", args0: [wfield(null)] }),
  hatDef({ type: "ev_change", message0: "✏ %1 의 값이 바뀌었을 때", args0: [wfield("change")] }),
  hatDef({ type: "ev_every", message0: "⏰ %1 초마다", args0: [{ type: "field_number", name: "SEC", value: 1, min: 0.01 }] }),
  hatDef({ type: "ev_msg", message0: "📨 %1 신호를 받았을 때", args0: [{ type: "field_input", name: "MSG", text: "신호1" }] }),
  stmt({ type: "msg_send", message0: "📨 %1 신호 보내기", args0: [{ type: "field_input", name: "MSG", text: "신호1" }], colour: C_EV }),
  { type: "key_down", message0: "⌨ %1 키가 눌려 있나?", args0: [dd("KEY", KEY_EVENTS)], output: "Boolean", colour: C_EV },
  // 화면 요소 (designer widgets)
  stmt({ type: "w_set_text", message0: "🧱 %1 의 글자를 %2 (으)로 바꾸기", args0: [wfield("text"), any("V")], colour: C_W }),
  { type: "w_get_text", message0: "🧱 %1 의 글자", args0: [wfield("text")], output: "String", colour: C_W },
  stmt({ type: "w_set_value", message0: "🧱 %1 의 값을 %2 (으)로 정하기", args0: [wfield("value"), any("V")], colour: C_W }),
  stmt({ type: "w_add_value", message0: "🧱 %1 의 값을 %2 만큼 바꾸기", args0: [wfield("value"), num("V")], colour: C_W }),
  { type: "w_get_value", message0: "🧱 %1 의 값", args0: [wfield("value")], output: null, colour: C_W },
  { type: "w_checked", message0: "🧱 %1 이(가) 선택되어 있나?", args0: [wfield("check")], output: "Boolean", colour: C_W },
  stmt({ type: "w_vis", message0: "🧱 %1 %2", args0: [wfield(null), dd("MODE", [["보이기", "show"], ["숨기기", "hide"], ["사용 가능하게", "enable"], ["사용 못 하게", "disable"]])], colour: C_W }),
  stmt({ type: "w_color", message0: "🧱 %1 의 %2 을(를) %3 (으)로", args0: [wfield(null), dd("WHICH", [["글자색", "color"], ["배경색", "background"]]), dd("C", COLORS)], colour: C_W }),
  stmt({ type: "w_move", message0: "🧱 %1 을(를) x %2 y %3 위치로", args0: [wfield(null), num("X"), num("Y")], colour: C_W }),
  stmt({ type: "w_list_add", message0: "🧱 %1 에 %2 항목 추가", args0: [wfield("list"), any("V")], colour: C_W }),
  stmt({ type: "w_list_clear", message0: "🧱 %1 항목 모두 지우기", args0: [wfield("list")], colour: C_W }),
  stmt({ type: "win_title", message0: "🪟 창 제목을 %1 (으)로", args0: [any("V")], colour: C_W }),
  // 창 · 대화상자
  stmt({ type: "ui_alert", message0: "📢 메시지 상자 %1", args0: [any("TEXT")], colour: C_UI, tooltip: "알림 창을 띄워요" }),
  stmt({ type: "ui_big", message0: "🪟 큰 글씨 창  제목 %1 내용 %2", args0: [any("TITLE"), any("TEXT")], colour: C_UI }),
  stmt({ type: "ui_ask", message0: "💬 %1 을(를) 묻고 대답 기다리기", args0: [any("TEXT")], colour: C_UI,
    tooltip: "질문 창을 띄우고, 입력한 내용은 '대답' 블록에 저장돼요" }),
  { type: "ui_answer", message0: "💬 대답", output: null, colour: C_UI, tooltip: "가장 최근 질문에 입력한 대답" },
  { type: "ui_ask_text", message0: "💬 질문하기 %1", args0: [any("TEXT")], output: "String", colour: C_UI, inputsInline: true },
  { type: "ui_ask_number", message0: "🔢 숫자 물어보기 %1", args0: [any("TEXT")], output: "Number", colour: C_UI, inputsInline: true },
  { type: "ui_confirm", message0: "❓ 예/아니오 묻기 %1", args0: [any("TEXT")], output: "Boolean", colour: C_UI, inputsInline: true },
  // 시간
  stmt({ type: "time_sleep", message0: "⏱ %1 초 기다리기", args0: [num("SEC")], colour: C_TIME }),
  { type: "time_now", message0: "🕒 현재 시각", output: "String", colour: C_TIME },
  { type: "time_today", message0: "📅 오늘 날짜", output: "String", colour: C_TIME },
  // 반복
  { type: "ctrl_forever", message0: "🔁 계속 반복하기", message1: "%1", args1: [{ type: "input_statement", name: "DO" }],
    previousStatement: null, colour: C_LOOP, tooltip: "프로그램을 끝낼 때까지 계속 반복해요" },
  // 컴퓨터
  stmt({ type: "sys_url", message0: "🌐 웹사이트 열기 %1", args0: [any("URL")], colour: C_SYS }),
  stmt({ type: "sys_run", message0: "▶ 프로그램/명령 실행 %1", args0: [any("CMD")], colour: C_SYS }),
  stmt({ type: "sys_beep", message0: "🔔 띵 소리 내기", colour: C_SYS }),
  stmt({ type: "sys_write", message0: "📄 파일 %1 에 %2 %3", args0: [any("PATH"), any("TEXT"), dd("MODE", [["덮어쓰기", "w"], ["이어쓰기", "a"]])], colour: C_SYS }),
  { type: "sys_read", message0: "📄 파일 %1 읽기", args0: [any("PATH")], output: "String", colour: C_SYS, inputsInline: true },
  stmt({ type: "sys_clip", message0: "📋 클립보드에 %1 복사", args0: [any("TEXT")], colour: C_SYS }),
  { type: "sys_exit", message0: "⛔ 프로그램 끝내기", previousStatement: null, colour: C_SYS },
  // 마우스 · 키보드 자동화
  stmt({ type: "auto_click_xy", message0: "🖱 x %1 y %2 클릭", args0: [num("X"), num("Y")], colour: C_AUTO }),
  stmt({ type: "auto_click", message0: "🖱 지금 위치 %1", args0: [dd("BTN", [["클릭", "click"], ["더블클릭", "doubleClick"], ["오른쪽 클릭", "rightClick"]])], colour: C_AUTO }),
  stmt({ type: "auto_move", message0: "🖱 마우스를 x %1 y %2 로 이동", args0: [num("X"), num("Y")], colour: C_AUTO }),
  stmt({ type: "auto_type", message0: "⌨ 글자 입력 %1", args0: [any("TEXT")], colour: C_AUTO }),
  stmt({ type: "auto_key", message0: "⌨ %1 키 누르기", args0: [dd("KEY", PRESS_KEYS)], colour: C_AUTO }),
  stmt({ type: "auto_hotkey", message0: "⌨ 단축키 %1", args0: [{ type: "field_input", name: "KEYS", text: "ctrl+c" }], colour: C_AUTO }),
  stmt({ type: "auto_scroll", message0: "🖱 스크롤 %1", args0: [num("N")], colour: C_AUTO, tooltip: "양수=위, 음수=아래" }),
  stmt({ type: "auto_shot", message0: "📸 화면 캡처해서 %1 에 저장", args0: [any("PATH")], colour: C_AUTO }),
  { type: "auto_pos", message0: "🖱 마우스 %1 좌표", args0: [dd("AXIS", [["x", "x"], ["y", "y"]])], output: "Number", colour: C_AUTO },
  // 거북이 (무대)
  stmt({ type: "t_move", message0: "🐢 %1 %2 만큼 이동", args0: [dd("DIR", [["앞으로", "forward"], ["뒤로", "back"]]), num("N")], colour: C_TURTLE }),
  stmt({ type: "t_turn", message0: "🐢 %1 으로 %2 도 돌기", args0: [dd("DIR", [["오른쪽", "right"], ["왼쪽", "left"]]), num("N")], colour: C_TURTLE }),
  stmt({ type: "t_goto", message0: "🐢 x %1 y %2 로 가기", args0: [num("X"), num("Y")], colour: C_TURTLE }),
  stmt({ type: "t_circle", message0: "⭕ 반지름 %1 원 그리기", args0: [num("R")], colour: C_TURTLE }),
  stmt({ type: "t_color", message0: "🎨 펜 색 %1", args0: [dd("C", COLORS)], colour: C_TURTLE }),
  stmt({ type: "t_bg", message0: "🖼 무대 배경색 %1", args0: [dd("C", COLORS)], colour: C_TURTLE }),
  stmt({ type: "t_width", message0: "✏ 펜 굵기 %1", args0: [num("N")], colour: C_TURTLE }),
  stmt({ type: "t_pen", message0: "✏ 펜 %1", args0: [dd("P", [["내리기 (그리기)", "pendown"], ["올리기 (안 그리기)", "penup"]])], colour: C_TURTLE }),
  stmt({ type: "t_fill", message0: "🪣 색 채우기 %1", args0: [dd("F", [["시작", "begin_fill"], ["끝", "end_fill"]])], colour: C_TURTLE }),
  stmt({ type: "t_speed", message0: "⚡ 속도 %1", args0: [dd("S", [["최고 속도", "0"], ["빠르게", "10"], ["보통", "6"], ["느리게", "1"]])], colour: C_TURTLE }),
  stmt({ type: "t_write", message0: "🔤 글자 쓰기 %1", args0: [any("TEXT")], colour: C_TURTLE }),
  stmt({ type: "t_misc", message0: "🐢 %1", args0: [dd("A", [["거북이 숨기기", "hideturtle"], ["거북이 보이기", "showturtle"], ["처음 위치로", "home"], ["그림 지우기", "clear"]])], colour: C_TURTLE }),
  { type: "t_pos", message0: "🐢 거북이 %1 좌표", args0: [dd("AXIS", [["x", "x"], ["y", "y"]])], output: "Number", colour: C_TURTLE },
]);
// event blocks get the round "hat" top
for (const t of ["ev_start", "ev_key", "ev_click", "ev_change", "ev_every", "ev_msg"]) {
  const orig = Blockly.Blocks[t].init;
  Blockly.Blocks[t].init = function () { orig.call(this); this.hat = "cap"; };
}
try { Blockly.libraryBlocks.loops.loopTypes.add("ctrl_forever"); } catch (e) {}

// ------------------------------------------------------------------ code generators
const F = G.forBlock;
const call = (code) => [code, O.FUNCTION_CALL];
const HATS = new Set(["ev_start", "ev_key", "ev_click", "ev_change", "ev_every", "ev_msg"]);
let hatCount = 0;
function hat(b, deco) {
  hatCount++;
  let code = "";
  const next = b.getNextBlock();
  if (next) {
    code = G.blockToCode(next);
    if (Array.isArray(code)) code = code[0];
  }
  const vars = Blockly.Variables.allUsedVarModels(b.workspace).map((v) => G.getVariableName(v.getId()));
  const glob = vars.length ? G.INDENT + "global " + vars.join(", ") + "\n" : "";
  const inner = code.trim() ? G.prefixLines(code, G.INDENT) : G.INDENT + "pass\n";
  return `${deco}\ndef _event_${hatCount}():\n${glob}${inner}\n`;
}
F.ev_start = (b) => hat(b, "@_on('start')");
F.ev_key = (b) => hat(b, `@_on('key', ${q(b.getFieldValue("KEY"))})`);
F.ev_click = (b) => hat(b, `@_on('click', ${q(b.getFieldValue("W"))})`);
F.ev_change = (b) => hat(b, `@_on('change', ${q(b.getFieldValue("W"))})`);
F.ev_every = (b) => hat(b, `@_on('every', ${Number(b.getFieldValue("SEC")) || 1})`);
F.ev_msg = (b) => hat(b, `@_on('msg', ${q(b.getFieldValue("MSG"))})`);
F.msg_send = (b) => `_broadcast(${q(b.getFieldValue("MSG"))})\n`;
F.key_down = (b) => call(`_key_down(${q(b.getFieldValue("KEY"))})`);

const W = (b) => q(b.getFieldValue("W"));
F.w_set_text = (b) => `_set_text(${W(b)}, ${val(b, "V", "''")})\n`;
F.w_get_text = (b) => call(`_get_text(${W(b)})`);
F.w_set_value = (b) => `_set_value(${W(b)}, ${val(b, "V", "0")})\n`;
F.w_add_value = (b) => `_set_value(${W(b)}, _num(_get_value(${W(b)})) + ${val(b, "V", "1")})\n`;
F.w_get_value = (b) => call(`_get_value(${W(b)})`);
F.w_checked = (b) => call(`bool(_get_value(${W(b)}))`);
F.w_vis = (b) => `_set_visible(${W(b)}, '${b.getFieldValue("MODE")}')\n`;
F.w_color = (b) => `_set_color(${W(b)}, '${b.getFieldValue("WHICH")}', '${b.getFieldValue("C")}')\n`;
F.w_move = (b) => `_move(${W(b)}, ${val(b, "X", "0")}, ${val(b, "Y", "0")})\n`;
F.w_list_add = (b) => `_list_add(${W(b)}, ${val(b, "V", "''")})\n`;
F.w_list_clear = (b) => `_list_clear(${W(b)})\n`;
F.win_title = (b) => `_set_title(${val(b, "V", "''")})\n`;

F.ui_alert = (b) => `_alert(${val(b, "TEXT", "''")})\n`;
F.ui_big = (b) => `_big(${val(b, "TITLE", "''")}, ${val(b, "TEXT", "''")})\n`;
F.ui_ask = (b) => `_ask_text(${val(b, "TEXT", "''")})\n`;
F.ui_answer = () => call("_answer()");
F.ui_ask_text = (b) => call(`_ask_text(${val(b, "TEXT", "''")})`);
F.ui_ask_number = (b) => call(`_ask_number(${val(b, "TEXT", "''")})`);
F.ui_confirm = (b) => call(`_confirm(${val(b, "TEXT", "''")})`);
F.text_prompt_ext = (b) => call(`${b.getFieldValue("TYPE") === "NUMBER" ? "_ask_number" : "_ask_text"}(${val(b, "TEXT", "''")})`);
F.time_sleep = (b) => `_wait(${val(b, "SEC", "1")})\n`;
F.time_now = () => { need("import_datetime"); return call("datetime.datetime.now().strftime('%H:%M:%S')"); };
F.time_today = () => { need("import_datetime"); return call("datetime.date.today().strftime('%Y-%m-%d')"); };
F.ctrl_forever = (b) => `while True:\n${G.INDENT}_tick()\n${G.statementToCode(b, "DO")}`;
F.sys_url = (b) => { need("import_web"); return `webbrowser.open(str(${val(b, "URL", "''")}))\n`; };
F.sys_run = (b) => `subprocess.Popen(str(${val(b, "CMD", "''")}), shell=True)\n`;
F.sys_beep = () => { need("import_winsound"); return "winsound.MessageBeep()\n"; };
F.sys_write = (b) => `with open(str(${val(b, "PATH", "'memo.txt'")}), '${b.getFieldValue("MODE")}', encoding='utf-8') as _f:\n    _f.write(str(${val(b, "TEXT", "''")}) + '\\n')\n`;
F.sys_read = (b) => call(`open(str(${val(b, "PATH", "'memo.txt'")}), encoding='utf-8').read()`);
F.sys_clip = (b) => `_clip(${val(b, "TEXT", "''")})\n`;
F.sys_exit = () => "_exit()\n";
F.auto_click_xy = (b) => { need("import_pyautogui"); return `pyautogui.click(${val(b, "X", "0")}, ${val(b, "Y", "0")})\n`; };
F.auto_click = (b) => { need("import_pyautogui"); return `pyautogui.${b.getFieldValue("BTN")}()\n`; };
F.auto_move = (b) => { need("import_pyautogui"); return `pyautogui.moveTo(${val(b, "X", "0")}, ${val(b, "Y", "0")}, duration=0.2)\n`; };

// ------------------------------------------------------------------ "대답" auto-fill (like Entry)
// When a block with an empty slot (e.g. "~이(가) 비어 있나?") is dropped below a question, plug in "대답".
const AUTO_INPUT = { text_isEmpty: "VALUE", logic_compare: "A", text_length: "VALUE", text_changeCase: "TEXT",
  text_trim: "TEXT", text_indexOf: "VALUE" };
function enclosingStatement(b) {
  let s = b;
  while (s && !s.previousConnection && !s.nextConnection) s = s.getParent();
  return s;
}
function askBefore(b) {
  let cur = enclosingStatement(b);
  for (let i = 0; cur && i < 300; i++) {
    cur = cur.getPreviousBlock();
    if (!cur) return false;
    if (cur.type === "ui_ask" || cur.getDescendants(false).some((d) => d.type === "ui_ask_text" || d.type === "ui_ask_number"))
      return true;
  }
  return false;
}
function autoFill(root, group) {
  for (const blk of [root, ...root.getDescendants(false)]) {
    const name = AUTO_INPUT[blk.type];
    const inp = name && blk.getInput(name);
    if (!inp || !inp.connection) continue;
    const t = inp.connection.targetBlock();
    if ((t && !t.isShadow()) || !askBefore(blk)) continue;
    Blockly.Events.setGroup(group || true);
    try {
      const a = ws.newBlock("ui_answer");
      a.initSvg();
      a.render();
      inp.connection.connect(a.outputConnection);
    } finally {
      Blockly.Events.setGroup(false);
    }
  }
}
ws.addChangeListener((e) => {
  if (e.type !== Blockly.Events.BLOCK_MOVE || !e.newParentId) return;
  const b = ws.getBlockById(e.blockId);
  if (b && b.type !== "ui_answer") autoFill(b, e.group);
});

// ------------------------------------------------------------------ API used from Python
let changeCount = 0;
ws.addChangeListener((e) => { if (!e.isUiEvent) changeCount++; });
function getCode() {
  hatCount = 0;
  G.init(ws);
  const parts = [];
  let loose = 0;
  for (const b of ws.getTopBlocks(true)) {
    if (!b.isEnabled()) continue;
    if (HATS.has(b.type) || b.type.startsWith("procedures_def")) {
      let c = G.blockToCode(b, true);
      if (Array.isArray(c)) c = c[0];
      if (c) parts.push(c);
    } else if (b.previousConnection || b.nextConnection) {
      loose++;
    }
  }
  const code = G.finish(parts.join("\n")).replace(/\n{3,}/g, "\n\n");
  return { code, loose };
}
function getState() { const r = getCode(); return JSON.stringify({ n: changeCount, code: r.code, loose: r.loose }); }
function saveWs() { return JSON.stringify(Blockly.serialization.workspaces.save(ws)); }
function rememberWidgetNames(obj) {
  // keep widget names used by loaded blocks valid even if the designer no longer has them
  const walk = (o) => {
    if (!o || typeof o !== "object") return;
    if (o.fields && typeof o.fields.W === "string" && !WIDGETS.some((w) => w.name === o.fields.W) && o.fields.W !== "__none__")
      WIDGETS.push({ name: o.fields.W, type: "?", label: o.fields.W + " (없음)" });
    for (const k in o) walk(o[k]);
  };
  walk(obj);
}
function fitView() {
  Blockly.svgResize(ws);
  ws.zoomToFit();
  if (ws.getScale() > 0.9) ws.setScale(0.9);
  ws.scrollCenter();
}
function loadWs(obj) {
  rememberWidgetNames(obj);
  ws.clear();
  Blockly.serialization.workspaces.load(obj, ws);
  setTimeout(fitView, 60);
}
function clearWs() { ws.clear(); }
function loadExample(name) { if (EXAMPLES[name]) loadWs(EXAMPLES[name]); }
function addEventFor(widget, kind) {
  const b = ws.newBlock(kind === "change" ? "ev_change" : "ev_click");
  b.setFieldValue(widget, "W");
  b.initSvg();
  b.render();
  const m = ws.getMetricsManager().getViewMetrics(true);
  b.moveBy(m.left + 40, m.top + 40 + Math.random() * 60);
  b.select();
}
window.addEventListener("resize", () => { if (!window.esdFitted && ws.getAllBlocks(false).length) { window.esdFitted = true; fitView(); } });
